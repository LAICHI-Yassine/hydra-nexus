version: '3.8'

services:
  # Le service de notre API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env  # On passe les clés d'API (Groq/HF) au conteneur de manière sécurisée
    networks:
      - hydra_network

  # Le service de notre Interface
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    # IMPORTANT : Le frontend a besoin de l'URL du backend dans le réseau interne de Docker
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - hydra_network

# Création d'un pont réseau privé pour que les deux conteneurs communiquent
networks:
  hydra_network:
    driver: bridge